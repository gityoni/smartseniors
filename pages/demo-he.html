<!DOCTYPE html>
<html lang="he" dir="rtl">

<title>SmartSeniors — הדגמה לשותפים · אמה בפעולה</title>
<!--
  Démo partenaire BILINGUE (hébreu RTL ⇄ français LTR).
  Un seul sélecteur « שפה / Langue » bascule TOUT : scénario, acte 2, libellés,
  sens de lecture, voix. Les deux langues ont les mêmes 49 étapes, les mêmes
  8 chapitres, les mêmes 11 champs et le même acte 2 en 17 temps.

  Écarts assumés avec /demo :
   1. le miroir RTL vit dans /ss-rtl.css (chargé en dernier), jamais ici ;
   2. pas de mode Live — le BASE_SYSTEM_PROMPT de chat.js impose le français,
      un Live en mode hébreu répondrait en français. Pour le rétablir :
      prompt hébreu côté chat.js.
   3. le scénario français est DUPLIQUÉ depuis demo.html plutôt que partagé :
      /demo est la page du pitch, en prod, et son intérêt est « zéro surprise ».
      L'extraction en module commun se fera quand l'acte 2 y sera porté aussi.

  Voix : hébreu → OpenAI forcé (eleven_multilingual_v2 ne couvre pas l'hébreu) ;
  français → aucun paramètre de voix, donc Shana (ElevenLabs) comme sur /demo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/ss-theme.css" />
<link rel="stylesheet" href="/ss-chat.css" />
<style>
  /* La couleur de base vit sur <html> : <body> reste transparent pour laisser
     voir le champ d'aurore de ss-demo.css (positionné en fixed, z-index 0). */
  html { background: #EEF6F3; }
  body { margin: 0; padding: 0; background: transparent; }
  /* Nunito ne contient AUCUN glyphe hébreu : sans repli explicite, chaque poste
     rendrait la démo dans sa police système (Arial Hebrew, Segoe UI…) et le
     visuel ne serait plus celui de /demo. Rubik est le plus proche de Nunito
     (grotesque légèrement arrondie) et nativement hébreu. L'ordre compte :
     le latin (SmartSeniors, GIR, €) reste en Nunito, l'hébreu tombe sur Rubik.
     Même spécificité que ss-theme.css, mais déclaré après → c'est celui-ci qui gagne. */
  .ss-root[data-font="nunito"] {
    --font: 'Nunito', 'Rubik', system-ui, sans-serif;
    --font-display: 'Nunito', 'Rubik', system-ui, sans-serif;
  }
  /* Mise en page « face à face » : la carte tient dans l'écran, rien ne bouge pendant la démo —
     le chat ET le dossier défilent chacun en interne, la console reste collée en bas. */
  .ss-root .ss-convo { padding-top: 8px; padding-bottom: 12px; }
  .ss-root .ss-convo-head { margin-bottom: 8px; }
  /* Desktop : la page tient exactement dans le viewport et le split prend TOUT
     l'espace restant sous l'en-tête. Plus de `calc(100vh - Xpx)` à réajuster à
     la main dès qu'on touche au header. Le chat récupère la place gagnée. */
  @media (min-width: 901px) {
    .ss-root { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .ss-root .ss-convo { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    /* `margin: 0 auto` empêche l'étirement en flex → largeur explicite. */
    .ss-root .ss-convo-head { width: 100%; }
    .ss-root #demo-split {
      flex: 1 1 0; min-height: 0; height: auto;
      width: 100%; max-width: 1180px;
      grid-template-columns: 1.15fr .85fr;
    }
  }
  @media (max-width: 900px) { .ss-root #demo-split { height: auto; min-height: 0; grid-template-columns: 1fr; } }
  .ss-root #demo-split .chat-scroll { max-height: none; min-height: 0; }
  /* dossier : tout le panneau défile d'un bloc (auto-scroll vers l'élément actif), plus de mini-boîte champs */
  .ss-root #demo-split .lead-side { overflow-y: auto; overflow-x: hidden; }
  .ss-root #demo-split .lead-side::-webkit-scrollbar { width: 6px; }
  .ss-root #demo-split .lead-side::-webkit-scrollbar-thumb { background: rgba(241,247,245,.18); border-radius: 4px; }
  .ss-root #demo-split .lead-fields { min-height: 0; flex: 0 0 auto; overflow: visible; gap: 8px; }
  .ss-root #demo-split .lfield { padding: 10px 13px; }
  .ss-root .cbub strong { color: var(--c-accent); }
  /* barre de contrôle démo */
  .ss-root .demo-ctrl { display: flex; align-items: center; gap: 8px; }
  .ss-root .demo-ctrl select { font-family: var(--font); border: 1.5px solid var(--c-line); border-radius: 8px; padding: 5px 8px; font-size: .8rem; background: var(--c-surface); color: var(--c-ink); }
  /* Le sélecteur de langue commande toute la page : il se voit. */
  .ss-root .demo-ctrl #lang-sel { border-color: var(--c-accent); font-weight: 800; color: var(--c-accent); }
  .ss-root .demo-note { font-size: .72rem; color: var(--c-ink-soft); font-weight: 600; }
  /* widget AGGIR */
  .ss-root .aggir { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-soft); max-width: 88%; }
  .ss-root .aggir-t { font-weight: 900; color: var(--c-ink); font-size: .9rem; margin-bottom: 4px; }
  .ss-root .aggir-sub { font-size: .72rem; color: var(--c-ink-soft); margin-bottom: 8px; }
  .ss-root .aggir-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--c-line); }
  .ss-root .aggir-row .q { flex: 1; font-size: .85rem; color: var(--c-ink); font-weight: 600; }
  .ss-root .aggir-opts { display: flex; gap: 5px; flex-shrink: 0; }
  .ss-root .aggir-opt { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--c-line); background: var(--c-bg); font-weight: 800; font-size: .82rem; color: var(--c-ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .18s; }
  .ss-root .aggir-opt.sel { color: #fff; border-color: transparent; transform: scale(1.08); }
  .ss-root .aggir-opt.sel[data-v="A"] { background: #15B79E; }
  .ss-root .aggir-opt.sel[data-v="B"] { background: #F59E0B; }
  .ss-root .aggir-opt.sel[data-v="C"] { background: #EF4444; }
  .ss-root .aggir-leg { font-size: .64rem; color: var(--c-ink-soft); margin-top: 8px; line-height: 1.4; }
  /* cartes features */
  .ss-root .dcard { background: var(--c-surface); border: 1px solid var(--c-line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow-soft); max-width: 86%; animation: ss-slideup .3s ease both; }
  .ss-root .dcard .dc-h { display: flex; align-items: center; gap: 11px; }
  .ss-root .dcard .dc-ico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0; background: var(--c-bg-alt); }
  .ss-root .dcard .dc-t { font-weight: 800; color: var(--c-ink); font-size: .92rem; line-height: 1.2; }
  .ss-root .dcard .dc-s { font-size: .8rem; color: var(--c-ink-soft); margin-top: 5px; line-height: 1.5; }
  .ss-root .dcard .dc-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 11px; background: var(--grad); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: .82rem; cursor: pointer; font-family: var(--font); text-decoration: none; }
  .ss-root .dcard-gir .dc-gauge { height: 10px; border-radius: 99px; background: var(--c-bg-alt); overflow: hidden; margin: 11px 0 4px; }
  .ss-root .dcard-gir .dc-gauge i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#3B82F6,#FFD93D,#EF4444); border-radius: 99px; transition: width 1s cubic-bezier(.4,0,.2,1); }
  .ss-root .dcard-gir .dc-scale { display: flex; justify-content: space-between; font-size: .62rem; color: var(--c-ink-soft); font-weight: 700; }
  .ss-root .dcard-video iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 11px; margin-top: 9px; }
  .ss-root .dcard-promo { border: 1.5px solid var(--c-accent); }
  .ss-root .dcard-promo .dc-ico { background: rgba(91,141,239,.14); }
  .ss-root .dcard-promo .dc-prix { font-size: 1.45rem; font-weight: 900; color: var(--c-accent); margin-top: 8px; }
  .ss-root .dcard-promo .dc-prix small { font-size: .8rem; font-weight: 700; color: var(--c-ink-soft); }
  .ss-root .dcard-itin .dc-route { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--c-ink); margin-top: 9px; font-weight: 700; }
  .ss-root .dcard-itin .dc-route .pin { color: var(--c-accent); }
  /* validation EDI — bloc back-office (panneau du dossier, fond vert foncé) */
  .ss-root .lead-edi { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(241,247,245,.1); position: relative; z-index: 1; opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s; pointer-events: none; }
  .ss-root .lead-edi.on { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .ss-root .lead-edi .le-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .ss-root .lead-edi .le-label { font-size: .82rem; font-weight: 900; color: #F1F7F5; }
  .ss-root .lead-edi .le-count { font-size: .72rem; font-weight: 800; color: var(--c-online); }
  .ss-root .lead-edi .edi-list { display: flex; flex-direction: column; gap: 6px; }
  .ss-root .lead-edi .edi-row { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 9px; background: rgba(255,255,255,.04); border: 1px solid rgba(241,247,245,.1); transition: background .3s, border-color .3s, opacity .3s; }
  .ss-root .lead-edi .edi-name { flex: 1; font-weight: 700; font-size: .78rem; color: rgba(241,247,245,.92); }
  .ss-root .lead-edi .edi-st { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: .72rem; flex-shrink: 0; }
  .ss-root .lead-edi .edi-row[data-st="pending"] .edi-st { color: rgba(241,247,245,.5); }
  .ss-root .lead-edi .edi-row[data-st="ok"] { border-color: rgba(110,231,183,.4); background: rgba(110,231,183,.1); }
  .ss-root .lead-edi .edi-row[data-st="ok"] .edi-st { color: var(--c-online); }
  .ss-root .lead-edi .edi-row[data-st="ko"] { opacity: .5; }
  .ss-root .lead-edi .edi-row[data-st="ko"] .edi-name { text-decoration: line-through; color: rgba(241,247,245,.55); }
  .ss-root .lead-edi .edi-row[data-st="ko"] .edi-st { color: #FCA5A5; }
  .ss-root .lead-edi .edi-motif { font-size: .64rem; font-weight: 700; color: rgba(241,247,245,.45); margin-inline-start: 5px; }
  .ss-root .lead-edi .edi-spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(241,247,245,.2); border-top-color: var(--c-online); animation: edi-spin .7s linear infinite; }
  @keyframes edi-spin { to { transform: rotate(360deg); } }
</style>

<body>

<div class="ss-root" data-direction="aurore" data-font="nunito" data-premium="on" style="--c-accent:#5B8DEF; --c-accent2:#9D8CF0;">

<script>
const TTS_URL = "/api/tts";
const CONSEILLER_TEL = "07 57 99 11 40"; // backend : si consentement = non, le lead part avec ce numéro

/* Isolat bidi (U+2066 LRI … U+2069 PDI). Sans lui, l'algorithme bidi rend les
   groupes de chiffres d'un paragraphe hébreu dans l'ordre RTL : « 06 24 18 52 40 »
   s'affiche « 40 52 18 24 06 ». Ce sont des caractères invisibles — ils traversent
   `textContent`, `innerHTML` et l'échappement de `mdBold` sans dommage, et sont
   inoffensifs en français. */
const L = (s) => "⁦" + s + "⁩";

/* ════════════════════════════════════════════════════════════════════════════
   SCÉNARIO HÉBREU — traduction 1:1 du scénario français validé.
   Même contexte (Garches, 92, AGGIR/GIR, APA, crédit d'impôt), même ordre,
   mêmes 49 étapes, mêmes 11 champs. Seule la langue change.
   ════════════════════════════════════════════════════════════════════════════ */
const SCRIPT_HE = [
  { chapter:"1 · פתיחה", t:'bot', noThink:true, text:"שלום, אני **אמה**, יועצת ב-SmartSeniors. 💛 אם הגעתם לכאן, סימן שמצבם של אמא או אבא שלכם מדאיג אתכם — ולרוב מגיעים מותשים, עם הרבה שאלות ומעט תשובות." },
  { t:'bot', noThink:true, text:"התפקיד שלי הוא לעזור לכם לעשות סדר, ללא תשלום. **אין שום טופס למלא**, ואף אחד לא יתקשר אליכם בלי שתאשרו. קחו את הזמן: **מה הכי מדאיג אתכם כרגע?**" },
  { t:'user', text:"זה בשביל אמא שלי… אני כבר לא מסוגלת, אני מרגישה אשמה, אבל אני לא עומדת בזה. בת 82, וזה מידרדר מהר.", fills:[['lien','בת']] },
  { t:'bot',  text:"אני מבינה לעומק את התשישות שלך, אין דרך אנושית לשאת נטל כזה לבד לאורך זמן. אל תהיי קשה מדי עם עצמך: עשית הרבה מעבר למקסימום שלך. כדי שאוכל לעזור טוב יותר, תוכלי לספר לי עוד על מצבה של אמא שלך היום?" },

let lang = 'he';
let T = LOCALES.he;                 // locale courante
const U = () => T.ui;
const SCRIPT = () => T.SCRIPT;

const chatBox = document.getElementById("chat-box");
const fieldsEl = document.getElementById("lead-fields");
const replayBtn = document.getElementById("replay");
const pauseBtn = document.getElementById("pause");
const langSel = document.getElementById("lang-sel");
const noteEl = document.getElementById("mode-note");

/* ── État du player ──
   running : un scénario est en cours (en lecture OU en pause)
   paused  : l'utilisateur a mis en pause (gèle le streaming) */
let running = false, paused = false;
let cancelRequested = false, runDone = Promise.resolve(), starting = false;
let pauseWaiters = [];
const CANCEL = Symbol("cancel");
const pace = () => parseFloat(document.getElementById('pace').value) || 1;
const down = () => { chatBox.scrollTop = chatBox.scrollHeight; };

function releasePause() { const w = pauseWaiters; pauseWaiters = []; w.forEach(fn => fn()); }
// Sas pause/annulation : bloque tant que `paused`, lève CANCEL si le run est annulé.
async function gate() {
  if (cancelRequested) throw CANCEL;
  while (paused) {
    await new Promise(res => pauseWaiters.push(res));
    if (cancelRequested) throw CANCEL;
  }
}
// Attente pace-aware et sensible à la pause (testée avant ET après le délai → gel net mi-phrase).
async function wait(ms) {
  await gate();
  await new Promise(r => setTimeout(r, ms / pace()));
  await gate();
}
const mdBold = (t) => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
// `*mot*` → accentué en dégradé (acte 2). `mdBold` a déjà consommé `**gras**`.
const mdPitch = (t) => mdBold(t).replace(/\*(.+?)\*/g, '<em>$1</em>');
const esc = (t) => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ── Voix d'Emma — 2 moteurs au choix ──
   « Emma (studio) » : POST /api/tts. En hébreu on force la voix OpenAI
   (`eleven_multilingual_v2` ne couvre pas l'hébreu) ; en français on ne passe
   aucun paramètre de voix, donc Shana (ElevenLabs), comme sur /demo — et donc
   la même clé de cache edge, déjà préchauffée.
   « Navigateur » : Web Speech API locale, zéro réseau. */
const TTS_VOICE = "coral";
const voiceSel = document.getElementById('voice-sel');
const TTS_OK = 'speechSynthesis' in window;
let voiceMode = 'off', navVoice = { he: null, fr: null }, currentAudio = null, speechGen = 0, speakWaiters = [];
function pickVoice() {
  const all = speechSynthesis.getVoices();
  const pick = (code, prefs) => {
    const vs = all.filter(v => (v.lang || '').toLowerCase().startsWith(code));
    return vs.find(v => prefs.some(p => v.name.toLowerCase().includes(p))) || vs[0] || null;
  };
  navVoice.he = pick('he', ['carmit', 'google עברית', 'hebrew']);
  navVoice.fr = pick('fr', ['amelie', 'amélie', 'audrey', 'aurelie', 'aurélie', 'marie', 'julie', 'hortense', 'google français', 'denise']);
}
if (TTS_OK) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
else voiceSel.querySelector('option[value="browser"]')?.remove();
const speakable = (t) => t
  .replace(/\*+/g, '')                 // **gras** et *accentué* : marqueurs d'écriture, pas de diction
  .replace(/[⁦-⁩]/g, '')     // isolats bidi : invisibles à l'écran, hors sujet pour la voix
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
  .replace(/→/g, ',').replace(/←/g, ',').replace(/\s·\s/g, ', ').replace(/\s+/g, ' ').trim();
// Vitesse de lecture : base à 1,15× (Emma était un peu lente en 1×), jamais en
// dessous — ralentir une voix la rend artificielle. Le timbre est préservé par
// `preservesPitch` : aucune distorsion jusqu'à ~1,3×.
const vRate = () => Math.min(1.6, Math.max(1.15, pace() * 1.15));
const ttsMem = new Map();
function getTTS(text) {
  const key = lang + '|' + text;
  if (!ttsMem.has(key)) {
    const body = lang === 'fr' ? { text: speakable(text) }
                               : { text: speakable(text), voice: TTS_VOICE, lang: 'he' };
    const p = fetch(TTS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(r => { if (!r.ok) throw new Error('TTS ' + r.status); return r.blob(); })
      .then(b => URL.createObjectURL(b));
    p.catch(() => ttsMem.delete(key));
    ttsMem.set(key, p);
  }
  return ttsMem.get(key);
}
function speakBrowser(text) {
  if (!TTS_OK) return Promise.resolve();
  return new Promise(res => {
    speakWaiters.push(res);
    const u = new SpeechSynthesisUtterance(speakable(text));
    const v = navVoice[lang];
    if (v) u.voice = v;
    u.lang = lang === 'fr' ? 'fr-FR' : 'he-IL'; u.rate = vRate(); u.pitch = 1.04;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speakPremium(text) {
  const gen = speechGen;
  const url = await getTTS(text);              // échec → speak() bascule sur la voix navigateur
  if (gen !== speechGen) return;               // annulé pendant le téléchargement
  await new Promise(res => {
    speakWaiters.push(res);
    const a = new Audio(url);
    // Sans ça, accélérer monte le timbre (effet « chipmunk »).
    a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true;
    a.playbackRate = vRate();
    currentAudio = a;
    const done = () => { if (currentAudio === a) currentAudio = null; res(); };
    a.onended = done; a.onerror = done;
    // Pause PENDANT le téléchargement : on ne démarre pas — `setPaused(false)`
    // relancera cet `<audio>`. Sans ça, Emma repartait par-dessus le commentaire.
    if (!paused) a.play().catch(done);
  });
}
async function speak(text) {
  if (voiceMode === 'premium') {
    try { return await speakPremium(text); }
    catch (e) {
      voiceMode = TTS_OK ? 'browser' : 'off'; voiceSel.value = voiceMode;
      noteEl.textContent = U().noteVoiceFail;
    }
  }
  if (voiceMode === 'browser') return speakBrowser(text);
}
function stopSpeech() {
  speechGen++;
  if (TTS_OK) { try { speechSynthesis.cancel(); } catch {} }
  if (currentAudio) { try { currentAudio.pause(); } catch {} currentAudio = null; }
  const w = speakWaiters; speakWaiters = []; w.forEach(fn => fn());
}
voiceSel.addEventListener('change', () => { stopSpeech(); voiceMode = voiceSel.value; });
// Anti-coupure Chrome (voix navigateur) : la synthèse se fige après ~15 s sans pause/resume.
if (TTS_OK) setInterval(() => { if (voiceMode === 'browser' && speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); speechSynthesis.resume(); } }, 12000);

/* ── Dossier ── */
function renderFieldsInit() {
  fieldsEl.innerHTML = T.FIELDS.map(f => `
    <div class="lfield" data-key="${f.key}">

      <div class="lf-body"><div class="lf-label">${f.label}</div><div class="lf-value">${f.hint}</div></div>

}
/* Une valeur de dossier mélange hébreu et données latines (« סילבי (בת) · 06 24 18 52 40 »).
   Chaque segment séparé par « · » devient un <bdi> : il garde sa direction propre,
   pendant que l'ordre des segments, lui, suit la page. Inoffensif en français. */
const bidiSegments = (val) => String(val).split(' · ').map(s => `<bdi>${esc(s)}</bdi>`).join(' · ');

/* Projecteur : le dossier s'efface autour du champ qui vient de tomber, le temps
   que l'œil y aille. La durée suit le curseur de vitesse, comme le reste. */
const leadSide = document.querySelector(".lead-side");
let spotTimer = null;
function clearSpotlight() {
  clearTimeout(spotTimer); spotTimer = null;
  leadSide.classList.remove("spotlight", "spot-edi", "spot-score", "spot-sent");
  fieldsEl.querySelectorAll(".lfield.spot").forEach(n => n.classList.remove("spot"));
}
function spotlight(el) {
  clearSpotlight();
  el.classList.add("spot"); leadSide.classList.add("spotlight");
  // Minuteur de secours pour tout remplissage hors boucle du scénario.
  spotTimer = setTimeout(clearSpotlight, 450 / pace());
}
/* Dans le scénario, c'est la BOUCLE qui tient le projecteur, pas un minuteur :
   `wait()` passe par `gate()`, donc le halo reste allumé tant que la démo est en
   pause — l'instant précis où on veut s'arrêter pour commenter la capture. */
async function holdSpot(ms) {
  clearTimeout(spotTimer); spotTimer = null;
  await wait(ms);
  clearSpotlight();
}
function setField(key, val) {
  const el = fieldsEl.querySelector(`.lfield[data-key="${key}"]`); if (!el) return;
  el.querySelector(".lf-value").innerHTML = bidiSegments(val);
  el.classList.add("filled");
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  // Instantané, pas « smooth » : un défilement doux dure autant que le
  // projecteur, le halo pouvait s'éteindre pendant que le champ arrivait.
  el.scrollIntoView({ block: "nearest", behavior: "instant" });
  spotlight(el);
  updateProgress(); down();
}
function updateProgress() {
  const n = fieldsEl.querySelectorAll(".lfield.filled").length;
  document.getElementById("pbar").style.width = Math.round(n / T.FIELDS.length * 100) + "%";
  // Le chiffre, pas seulement la barre. `direction: ltr` sur `.lc-n` (ss-demo.css)
  // empêche « 7 / 11 » de se lire « 11 / 7 » en hébreu.
  document.getElementById("lead-count").textContent = `${n} / ${T.FIELDS.length}`;
}
function resetDossier() {
  clearSpotlight();
  renderFieldsInit();
  document.getElementById("lead-sent").classList.remove("show");
  document.getElementById("lead-score").classList.remove("on");
  document.getElementById("ls-meter").style.width = "0%";
  const b = document.getElementById("ls-badge"); b.className = "ls-badge froid"; b.textContent = "—";
  document.getElementById("lead-edi").classList.remove("on");
  document.getElementById("edi-list").innerHTML = ""; document.getElementById("le-count").textContent = "";
}

// `noThink` : pas de bulle « je réfléchis » — réservé à l'accueil, où Emma n'a

async function botSay(text, noThink, cls) {

    chatBox.appendChild(tk); down(); await wait(650); tk.remove();

    for (let i = 0; i < words.length; i++) { acc += (i ? " " : "") + words[i]; b.innerHTML = mdBold(acc) + '<span class="ccursor"></span>'; down(); await wait(38); }

    await said;

// Temps de lecture d'une réplique famille : une base + ~14 ms par caractère,

  const sent = document.getElementById("lead-sent");
  sent.classList.add("show");
  // Point de sortie du pitch : amené à l'écran et tenu sous projecteur, quelle
  // que soit la hauteur du poste.
  sent.scrollIntoView({ block: "nearest", behavior: "instant" });
  clearSpotlight(); leadSide.classList.add("spot-sent");
  down();
  await wait(1200);
  leadSide.classList.remove("spot-sent");
}

/* ── Console de contrôle ────────────────────────────────────────────────────
   Trois états : au repos, en lecture, en pause. Le bouton principal porte
   l'action suivante, jamais l'état courant. */
const PAUSE_ICO = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
const PLAY_ICO  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const chapterSel = document.getElementById('chapter');
const dcBar = document.getElementById('dc-bar');
const dcStep = document.getElementById('dc-step');
const splitEl = document.getElementById('demo-split');
let doneOnce = false, pitchDone = false;

function updatePauseUI() {
  // À la fin du scénario, l'action suivante n'est pas « rejouer » : c'est l'acte 2.
  const toPitch = !running && doneOnce && !pitchDone;
  const label = running ? (paused ? U().resume : U().pause)
              : toPitch ? U().toPitch
              : (doneOnce || pitchDone) ? U().restart : U().play;
  pauseBtn.innerHTML = (running && !paused ? PAUSE_ICO : PLAY_ICO) + `<span>${label}</span>`;
  pauseBtn.classList.toggle('is-paused', running && paused);
  pauseBtn.classList.toggle('is-next', toPitch);
  pauseBtn.setAttribute('aria-label', label);
  replayBtn.disabled = !running && !doneOnce && !pitchDone;
}
function setProgress(i, total) {
  const n = total || SCRIPT().length;
  dcBar.style.width = Math.round((i / n) * 100) + '%';
  dcStep.textContent = `${i} / ${n}`;
}
// Options de chapitre construites depuis le scénario : pas de liste à maintenir
// en double, un `chapter:` sur un step suffit. L'acte 2 s'ajoute à la fin.
function buildChapters() {
  chapterSel.innerHTML = `<option value="">${U().chapterPlaceholder}</option>` +
    SCRIPT().map((s, i) => s.chapter ? `<option value="${i}">${s.chapter}</option>` : '').join('') +
    `<option value="pitch">${U().pitchChapter}</option>`;
}
// Rejoue muettement tout ce qui précède le chapitre visé : bulles posées d'un
// coup, champs remplis sans projecteur — sinon on sauterait au budget avec un
// dossier vide.
function fastForward(to) {
  for (let i = 0; i < to; i++) {
    const s = SCRIPT()[i];
    if (s.t === 'bot' || s.t === 'user') {
      const r = rowEl(s.t === 'bot' ? 'bot' : 'user');
      const b = document.createElement('div'); b.className = 'cbub';
      b.innerHTML = mdBold(s.text); r.appendChild(b); chatBox.appendChild(r);
    }
    if (s.t === 'score') applyScore(s);
    if (s.fills) for (const [k, v] of s.fills) {
      const el = fieldsEl.querySelector(`.lfield[data-key="${k}"]`);
      if (el) { el.querySelector('.lf-value').innerHTML = bidiSegments(v); el.classList.add('filled'); }
    }
  }
  clearSpotlight(); updateProgress(); down();
}
function setPaused(p) {
  if (!running) return;
  paused = p;
  if (TTS_OK) { try { p ? speechSynthesis.pause() : speechSynthesis.resume(); } catch {} }
  if (currentAudio) { try { p ? currentAudio.pause() : currentAudio.play(); } catch {} }
  if (!paused) releasePause();
  updatePauseUI();
  noteEl.textContent = paused ? U().notePaused : U().notePlaying;
}

// Arrête proprement le run en cours et attend qu'il se soit dénoué.
async function stopRun() {
  if (running) { cancelRequested = true; paused = false; releasePause(); stopSpeech(); }
  await runDone;
  cancelRequested = false; paused = false; stopSpeech();
}

// (Re)lance le scénario déterministe — depuis le début, ou depuis un chapitre.
async function startScript(from = 0) {
  if (starting) return;
  starting = true;
  await stopRun();
  let resolveDone; runDone = new Promise(r => resolveDone = r);
  running = true; pitchDone = false;
  splitEl.classList.remove('pitch');          // sortie de l'acte 2 : le dossier revient
  resetDossier(); chatBox.innerHTML = "";
  if (from > 0) fastForward(from);
  setProgress(from); updatePauseUI();
  noteEl.textContent = U().notePlaying;
  starting = false;
  try {
    await wait(400);
    const steps = SCRIPT();
    for (let si = from; si < steps.length; si++) {
      setProgress(si);
      const step = steps[si];
      // voix studio : précharge la réplique d'Emma suivante pendant que celle-ci se joue
      if (step.t === 'bot' && voiceMode === 'premium') {
        const next = steps.slice(si + 1).find(s => s.t === 'bot');
        if (next) getTTS(next.text).catch(() => {});
      }
      if (step.t === 'bot') await botSay(step.text, step.noThink);
      else if (step.t === 'user') await userSay(step.text);
      else if (step.t === 'aggir') await runAggir(step.items);
      else if (step.t === 'edi') await showEdi(step);
      else if (step.t === 'card') await showCard(step);
      else if (step.t === 'score') await showScore(step);
      else if (step.t === 'sent') await showSent(step);
      // Respiration : le projecteur tient 450 ms (fondu compris). Ce silence
      // occupe un temps mort du chat — rien n'est coupé.
      if (step.fills) for (const [k, v] of step.fills) { setField(k, v); await holdSpot(450); await wait(60); }
      // Après une réplique famille, on laisse le temps de LIRE avant qu'Emma
      // enchaîne : proportionnel à la longueur du message.
      await wait(step.t === 'bot' ? 320 : step.t === 'user' ? readPause(step.text) : 220);
    }
    setProgress(steps.length); doneOnce = true;
    noteEl.textContent = U().noteDone;
  } catch (e) {
    if (e !== CANCEL) throw e;                 // annulation = arrêt silencieux
  } finally {
    running = false; updatePauseUI(); resolveDone();
  }
}

/* ── Acte 2 ── */
async function punchSay(text) {
  const said = speak(text);
  setSpeaking(true);
  try {
    const d = document.createElement("div"); d.className = "p-punch";
    d.innerHTML = mdPitch(text);
    chatBox.appendChild(d); down();
    await said;
  } finally { setSpeaking(false); }
}
async function showPitchEnd(step) {
  const said = speak(`${step.titre} ${step.sous} ${step.question}`);
  const d = document.createElement("div"); d.className = "pitch-end";
  d.innerHTML = `<div class="pe-t">${mdPitch(step.titre)}</div>
    <div class="pe-s">${mdPitch(step.sous)}</div>
    <div class="pe-q">${step.question}</div>`;
  chatBox.appendChild(d); down();
  await said;
}
async function startPitch() {
  if (starting) return;
  starting = true;
  await stopRun();
  let resolveDone; runDone = new Promise(r => resolveDone = r);
  running = true; doneOnce = true; pitchDone = false;
  splitEl.classList.add("pitch");             // le dossier part, le chat s'ouvre
  updatePauseUI();
  noteEl.textContent = U().notePitch;
  starting = false;
  const steps = T.PITCH;
  try {
    await wait(750);                          // on laisse le panneau finir de glisser
    chatBox.innerHTML = "";
    await wait(300);
    for (let i = 0; i < steps.length; i++) {
      setProgress(i, steps.length);
      const s = steps[i];
      if (s.t === 'a' || s.t === 'q') {
        if (voiceMode === 'premium') {
          const n = steps[i + 1];
          if (n && n.text) getTTS(n.text).catch(() => {});
        }
        await botSay(s.text, s.noThink, s.t === 'q' ? 'p-q' : 'p-a');
      }
      else if (s.t === 'punch') await punchSay(s.text);
      else if (s.t === 'end') await showPitchEnd(s);
      // Une question doit rester seule à l'écran le temps qu'elle travaille.
      await wait(s.t === 'q' ? 1100 : s.t === 'punch' ? 900 : 420);
    }
    setProgress(steps.length, steps.length);
    pitchDone = true;
    noteEl.textContent = U().notePitchDone;
  } catch (e) {
    if (e !== CANCEL) throw e;
  } finally {
    running = false; updatePauseUI(); resolveDone();
  }
}

/* ── Écran d'attente : la démo ne démarre pas toute seule ── */
function showIdle() {
  splitEl.classList.remove('pitch');
  chatBox.innerHTML = `
    <div class="dstart">
      <div class="ds-av">${avatarSVG()}</div>
      <div class="ds-t">${U().idleT}</div>
      <div class="ds-s">${U().idleS}</div>
      <button class="ds-go" id="ds-go" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        ${U().idleGo}
      </button>
      <div class="ds-hint">${U().idleHint}</div>
    </div>`;
  document.getElementById('ds-go').addEventListener('click', () => startScript());
  setProgress(0);
  noteEl.textContent = U().noteIdle;
}

/* ── Bascule de langue : elle commande TOUT ─────────────────────────────────
   sens de lecture, libellés, scénario, acte 2 et langue de diction. Un
   changement remet la démo à zéro : on ne mélange pas deux langues à l'écran. */
function applyLocale(code) {
  lang = code; T = LOCALES[code];
  const u = U();
  document.documentElement.dir = T.dir;
  document.documentElement.lang = T.htmlLang;
  document.title = u.title;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  // Seule exception : la signature de marque porte du balisage (chaîne d'auteur, pas de donnée externe).
  document.getElementById('ui-wm-sub').innerHTML = u.wmSub;
  set('ui-lang-label', u.langLabel); set('ui-voice-label', u.voiceLabel);
  set('ui-pace-label', u.paceLabel); set('ui-kicker', u.kicker); set('ui-h2', u.h2); set('ui-lede', u.lede);
  set('ui-emma-name', u.emmaName); set('ui-emma-role', u.emmaRole);
  set('ui-lead-t', u.leadT); set('ui-lead-s', u.leadS); set('ui-live', u.live);
  set('ui-score-label', u.scoreLabel); set('ui-cold', u.cold); set('ui-warm', u.warm); set('ui-hot', u.hot);
  set('ui-edi-label', u.ediLabel); set('ui-replay', u.replay); set('ui-lead-count-lab', u.countLab);
  // Libellés des <option> : les valeurs, elles, ne bougent pas.
  const vo = voiceSel.options;
  [u.voiceOff, u.voiceStudio, u.voiceBrowser].forEach((t, i) => { if (vo[i]) vo[i].textContent = t; });
  // Le « × » de la vitesse est un caractère neutre : isolé, il ne passe pas
  // derrière le nombre en RTL (« 2× » deviendrait « ×2 »).
  const po = document.getElementById('pace').options;
  u.paceLabels.forEach((t, i) => { if (po[i]) po[i].textContent = L(t); });
  chatBox.setAttribute('aria-label', u.chatAria);
  document.getElementById('console').setAttribute('aria-label', u.consoleAria);
  chapterSel.setAttribute('aria-label', u.chapterAria);
  langSel.value = code;
  renderFieldsInit(); buildChapters();
}

/* ── Wiring ── */
replayBtn.addEventListener("click", () => startScript());
// Bouton principal : pause/reprise si ça tourne ; sinon il enchaîne — démo,
// puis acte 2, puis relance. Il porte l'action suivante, jamais l'état courant.
pauseBtn.addEventListener("click", () => {
  if (running) return setPaused(!paused);
  if (doneOnce && !pitchDone) return startPitch();
  startScript();
});
chapterSel.addEventListener("change", () => {
  const v = chapterSel.value; if (v === "") return;
  chapterSel.value = "";
  if (v === "pitch") startPitch(); else startScript(+v);
});
langSel.addEventListener("change", async () => {
  await stopRun();
  running = false; doneOnce = false; pitchDone = false;
  applyLocale(langSel.value);
  resetDossier(); updatePauseUI(); showIdle();
});

/* ── Init : on attend le présentateur, pas d'autoplay ── */
applyLocale('he');
updatePauseUI();
showIdle();
</script>
</body>
</html>
